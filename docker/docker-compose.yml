version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: osp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: osp
      POSTGRES_PASSWORD: osp
      POSTGRES_DB: osp_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: osp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
